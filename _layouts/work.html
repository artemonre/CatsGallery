---
layout: default
---
<article class="work">
  <img class="work-image" src="{{ page.image | relative_url }}" alt="{{ page.title }}"
       onclick="document.getElementById('viewer').showModal()">
  <dialog id="viewer" class="viewer" onclick="this.close()">
    <img src="{{ page.image | relative_url }}" alt="{{ page.title }}">
  </dialog>
  <h1 class="work-title">
    {{ page.title }}
    {% if page.sold %}<span class="stamp">Sold</span>{% endif %}
  </h1>
  <div class="poem">
    {{ content }}
  </div>
  {% unless page.sold %}
  <details class="more">
    <summary class="button">Buy</summary>
    <div class="more-content">
      <p>Purchase details coming soon.</p>
    </div>
  </details>
  {% endunless %}
  <a class="back" href="{{ '/' | relative_url }}">← All works</a>
</article>
