---
layout: default
---
<article class="work">
  <img class="work-image" src="{{ page.image | relative_url }}" alt="{{ page.title }}">
  <div class="poem">
    {{ content }}
  </div>
  {% unless page.sold %}
  <details class="more">
    <summary class="button">Buy</summary>
    <div class="more-content">
      <p>Purchase details coming soon.</p>
    </div>
  </details>
  {% endunless %}
  <a class="back" href="{{ '/' | relative_url }}">← All works</a>
</article>
